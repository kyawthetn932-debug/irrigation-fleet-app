name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Fresh Project Layout
        run: |
          rm -rf pubspec.yaml lib test
          flutter create --template=app --project-name=irrigation_fleet .
          rm -rf lib/main.dart

      - name: Inject Gestures Drawer App Code
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() => runApp(const MaterialApp(home: IrrigationFleetApp(), debugShowCheckedModeBanner: false));

          class IrrigationFleetApp extends StatefulWidget {
            const IrrigationFleetApp({super.key});
            @override
            State<IrrigationFleetApp> createState() => _IrrigationFleetAppState();
          }

          class _IrrigationFleetAppState extends State<IrrigationFleetApp> {
            String _view = "Dashboard"; 
            Color _currentBgColor = const Color(0xFFFDFBF7); 
            String _bgColorName = "နို့နှစ်ရောင်ဖျော့ (Creamy White)";

            final _driver = TextEditingController(text: "ဦးအောင်");
            final _morning = TextEditingController(text: "0");
            final _afternoon = TextEditingController(text: "0");
            final _evening = TextEditingController(text: "0");
            final _rate = TextEditingController(text: "5000");
            final _fuelPrice = TextEditingController(text: "450000");
            int _selectedBarrelGallons = 50;

            void _changeTheme(Color newColor, String name) {
              setState(() {
                _currentBgColor = newColor;
                _bgColorName = name;
              });
            }

            @override
            Widget build(BuildContext context) {
              int totalTrips = (int.tryParse(_morning.text) ?? 0) + (int.tryParse(_afternoon.text) ?? 0) + (int.tryParse(_evening.text) ?? 0);
              int totalSalary = totalTrips * (int.tryParse(_rate.text) ?? 0);
              int barrelPrice = int.tryParse(_fuelPrice.text) ?? 0;
              double pricePerGallon = barrelPrice / _selectedBarrelGallons;

              return Scaffold(
                backgroundColor: _currentBgColor,
                appBar: AppBar(
                  title: Text('ဆည်မြောင်း ကားစာရင်း ($_view)', style: const TextStyle(color: Colors.amber, fontWeight: FontWeight.bold)),
                  backgroundColor: const Color(0xFF2C3E50),
                  iconTheme: const IconThemeData(color: Colors.amber),
                ),
                drawer: Drawer(
                  width: 230,
                  backgroundColor: const Color(0xFFFAFAFA),
                  child: Column(
                    children: [
                      Container(
                        width: double.infinity,
                        padding: const EdgeInsets.symmetric(vertical: 25, horizontal: 15),
                        decoration: const BoxDecoration(
                          gradient: LinearGradient(colors: [Colors.blueAccent, Color(0xFFF0F3F4)], begin: Alignment.topCenter, end: Alignment.bottomCenter)
                        ),
                        child: const Row(
                          children: [
                            Icon(Icons.local_shipping, color: Colors.orange, size: 30), 
                            SizedBox(width: 8), 
                            Text('ကားစာရင်း မီနူး', style: TextStyle(fontSize: 15, fontWeight: FontWeight.bold, color: Color(0xFF2C3E50)))
                          ]
                        ),
                      ),
                      Expanded(
                        child: ListView(
                          padding: EdgeInsets.zero,
                          children: [
                            _buildDrawerItem("၁။ ပင်မ ဒက်ရှ်ဘုတ်", Icons.dashboard, "Dashboard", context),
                            _buildDrawerItem("၂။ ကားပိုင်ရှင်များ", Icons.people, "Owners", context),
                            _buildDrawerItem("၃။ နေ့စဉ် ကားခ/ဆီစာရင်း", Icons.table_chart, "DailyLogs", context),
                            _buildDrawerItem("၄။ ကိုကျော်သက်နိုင် သီးသန့်", Icons.star, "KoKyawThetNaing", context),
                            _buildDrawerItem("၇။ စနစ် ဆက်တင်များ", Icons.settings, "Settings", context),
                          ],
                        ),
                      )
                    ],
                  ),
                ),
                body: Padding(
                  padding: const EdgeInsets.all(20),
                  child: _buildMainContent(totalTrips, totalSalary, pricePerGallon),
                ),
              );
            }

            Widget _buildDrawerItem(String title, IconData icon, String viewName, BuildContext context) {
              return ListTile(
                leading: Icon(icon, color: Colors.orange, size: 20),
                title: Text(title, style: const TextStyle(color: Color(0xFF2C3E50), fontSize: 14, fontWeight: FontWeight.w500)),
                onTap: () {
                  setState(() => _view = viewName);
                  Navigator.pop(context); 
                },
              );
            }

            Widget _buildMainContent(int totalTrips, int totalSalary, double pricePerGallon) {
              if (_view == "KoKyawThetNaing") {
                return SingleChildScrollView(
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      const Text("👑 ကိုကျော်သက်နိုင် သီးသန့် ကားစာရင်း (ဒရိုင်ဘာ/ဆီ တွက်ချက်မှု)", style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold, color: Colors.orange)),
                      const SizedBox(height: 20),
                      TextField(controller: _driver, style: const TextStyle(color: Colors.black87), decoration: const InputDecoration(labelText: "ယာဉ်မောင်းအမည်", labelStyle: TextStyle(color: Colors.black54), border: OutlineInputBorder())),
                      const SizedBox(height: 15),
                      Row(children: [
                        Expanded(child: TextField(controller: _morning, keyboardType: TextInputType.number, style: const TextStyle(color: Colors.black87), decoration: const InputDecoration(labelText: "နံနက် ခေါက်ရေ", labelStyle: TextStyle(color: Colors.black54), border: OutlineInputBorder()), onChanged: (v) => setState(() {}))),
                        const SizedBox(width: 10),
                        Expanded(child: TextField(controller: _afternoon, keyboardType: TextInputType.number, style: const TextStyle(color: Colors.black87), decoration: const InputDecoration(labelText: "နေ့လယ် ခေါက်ရေ", labelStyle: TextStyle(color: Colors.black54), border: OutlineInputBorder()), onChanged: (v) => setState(() {}))),
                        const SizedBox(width: 10),
                        Expanded(child: TextField(controller: _evening, keyboardType: TextInputType.number, style: const TextStyle(color: Colors.black87), decoration: const InputDecoration(labelText: "ည ခေါက်ရေ", labelStyle: TextStyle(color: Colors.black54), border: OutlineInputBorder()), onChanged: (v) => setState(() {}))),
                      ]),
                      const SizedBox(height: 15),
                      TextField(controller: _rate, keyboardType: TextInputType.number, style: const TextStyle(color: Colors.black87), decoration: const InputDecoration(labelText: "ဒရိုင်ဘာ သတ်မှတ်ခေါက်ကြေးနှုန်း (ကျပ်)", labelStyle: TextStyle(color: Colors.black54), border: OutlineInputBorder()), onChanged: (v) => setState(() {})),
                      const SizedBox(height: 20),
                      const Text("ကော်လံခေါင်းစဉ် - ၁ ပေပါလျှင် သတ်မှတ်ဂါလံ ပမာဏရွေးချယ်ရန်", style: TextStyle(fontSize: 15, color: Colors.blueGrey, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 10),
                      Row(children:.map((g) => Padding(padding: const EdgeInsets.only(right: 15), child: ChoiceChip(label: Text("$g ဂါလံ"), selected: _selectedBarrelGallons == g, onSelected: (s) => setState(() => _selectedBarrelGallons = g)))).toList()),
                      const SizedBox(height: 15),
                      TextField(controller: _fuelPrice, keyboardType: TextInputType.number, style: const TextStyle(color: Colors.black87), decoration: const InputDecoration(labelText: "ဆီပေပါဈေးနှုန်း (ကျပ်)", labelStyle: TextStyle(color: Colors.black54), border: OutlineInputBorder()), onChanged: (v) => setState(() {})),
                      const Divider(height: 40, color: Colors.black26),
                      const Text("📊 တွက်ချက်မှု ရလဒ်များ", style: TextStyle(fontSize: 18, color: Colors.green, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 15),
                      Text("စုစုပေါင်း ခေါက်ရေ: $totalTrips ခေါက်", style: const TextStyle(fontSize: 16, color: Colors.black87)),
                      Text("ဒရိုင်ဘာ မောင်းကြေး စုစုပေါင်း: $totalSalary ကျပ်", style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.deepOrange)),
                      Text("၁ ဂါလံကျသင့်ဈေးနှုန်း: ${pricePerGallon.toStringAsFixed(2)} ကျပ်", style: const TextStyle(fontSize: 16, color: Colors.blue, fontWeight: FontWeight.bold)),
                    ],
                  ),
                );
              } else if (_view == "Settings") {
                return Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    const Text("⚙️ စနစ် ဆက်တင်များနှင့် နောက်ခံအရောင် ပြောင်းလဲခြင်း", style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold, color: Colors.orange)),
                    const SizedBox(height: 25),
