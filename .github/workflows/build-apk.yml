name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Flutter Project
        run: |
          rm -rf pubspec.yaml lib
          flutter create --template=app --project-name=irrigation_fleet .
          rm -rf test

      - name: Build APK with Network Retry
        run: |
          flutter pub get
          flutter build apk --release || (sleep 10 && flutter build apk --release)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: irrigation-fleet-app
          path: build/app/outputs/flutter-apk/app-release.apk
