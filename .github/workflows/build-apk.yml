name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Actions/checkout@v4
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Generate Fresh Project Layout
        run: |
          rm -rf pubspec.yaml lib test
          flutter create --template=app --project-name=irrigation_fleet .
          rm -rf lib/main.dart

      - name: Inject Features Drawer App Code
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() => runApp(const MaterialApp(home: IrrigationFleetHomePage(), debugShowCheckedModeBanner: false));

          class IrrigationFleetHomePage extends StatefulWidget {
            const IrrigationFleetHomePage({super.key});
            @override
            State<IrrigationFleetHomePage> createState() => _IrrigationFleetHomePageState();
          }

          class _IrrigationFleetHomePageState extends State<IrrigationFleetHomePage> {
            Color _currentBgColor = const Color(0xFFFBFBFB);
            String _bgColorName = "မူလအရောင် (Creamy White)";

            final _driver = TextEditingController(text: "မောင်မောင်");
            final _morning = TextEditingController(text: "0");
            final _afternoon = TextEditingController(text: "0");
            final _evening = TextEditingController(text: "0");
            final _rate = TextEditingController(text: "5000");
            final _fuelPrice = TextEditingController(text: "610000");
            int _selectedBarrelGallons = 50;

            void _changeThemeColor(Color newColor, String name) {
              setState(() {
                _currentBgColor = newColor;
                _bgColorName = name;
              });
            }

            @override
            Widget build(BuildContext context) {
              int totalTrips = (int.tryParse(_morning.text) ?? 0) + (int.tryParse(_afternoon.text) ?? 0) + (int.tryParse(_evening.text) ?? 0);
              int totalSalary = totalTrips * (int.tryParse(_rate.text) ?? 0);
              int barrelPrice = (int.tryParse(_fuelPrice.text) ?? 0);
              double pricePerGallon = barrelPrice / _selectedBarrelGallons;

              return Scaffold(
                backgroundColor: _currentBgColor,
                appBar: AppBar(
                  title: const Text("ရေဖျန်းလုပ်ငန်းသုံး App (Title)"),
                  backgroundColor: const Color(0xFF1C3E5D),
                  iconTheme: const IconThemeData(color: Colors.amber),
                ),
                drawer: Drawer(
                  width: 230,
                  backgroundColor: const Color(0xFFFAFAFA),
                  child: ListView(
                    padding: EdgeInsets.zero,
                    children: [
                      Container(
                        height: 200,
                        width: double.infinity,
                        padding: const EdgeInsets.symmetric(vertical: 25, horizontal: 15),
                        decoration: const BoxDecoration(
                          gradient: LinearGradient(colors: [Colors.blueAccent, Color(0xFF3F91F1)], begin: Alignment.topCenter, end: Alignment.bottomCenter),
                        ),
                        child: const Row(
                          children: [
                            Icon(Icons.local_shipping, color: Colors.orange, size: 30),
                            SizedBox(width: 8),
                            Text("ရေဖျန်းလုပ်ငန်းသုံး App", style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.white)),
                          ],
                        ),
                      ),
                      ExpansionTile(
                        title: const Row(
                          children: [
                            Icon(Icons.dashboard, color: Colors.indigo, size: 20),
                            SizedBox(width: 8),
                            Text("Dashboard", style: TextStyle(fontSize: 14)),
                          ],
                        ),
                        childrenPadding: const EdgeInsets.only(left: 20),
                        children: [
                          _buildDrawerItem("ပင်မစာမျက်နှာ", const Icon(Icons.home, color: Colors.blue, size: 18), () {}),
                          _buildDrawerItem("လုပ်ငန်းမှတ်တမ်းများ", const Icon(Icons.table_chart, color: Colors.teal, size: 18), () {}),
                          _buildDrawerItem("ဝင်ငွေ/ထွက်ငွေ တွက်ချက်ရန်", const Icon(Icons.calculate, color: Colors.purple, size: 18), () {}),
                          _buildDrawerItem("ဆက်တင်များ", const Icon(Icons.settings, color: Colors.grey, size: 18), () {}),
                        ],
                      ),
                    ],
                  ),
                ),
                body: Padding(
                  padding: const EdgeInsets.all(20),
                  child: _buildMainContent(totalTrips, totalSalary, pricePerGallon),
                ),
              );
            }

            Widget _buildDrawerItem(String title, Icon iconData, VoidCallback onTap) {
              return ListTile(
                leading: iconData,
                title: Text(title, style: const TextStyle(color: Color(0xFF2C3E50), fontSize: 14, fontWeight: FontWeight.w500)),
                onTap: () {
                  onTap();
                  Navigator.pop(context);
                },
              );
            }

            Widget _buildMainContent(int totalTrips, int totalSalary, double pricePerGallon) {
              return SingleChildScrollView(
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Text("ရေဖျန်းလုပ်ငန်းတွက်ချက်မှုစနစ်", style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold, color: Colors.blueGrey)),
                    const SizedBox(height: 20),
                    Text("ယာဉ်မောင်းအမည်: ${_driver.text}", style: const TextStyle(fontSize: 16, color: Colors.black87)),
                    const SizedBox(height: 10),
                    Row(
                      children: [
                        Expanded(child: TextField(controller: _morning, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: "နံနက်ခင်းခေါက်ရေ"))),
                        const SizedBox(width: 10),
                        Expanded(child: TextField(controller: _afternoon, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: "မွန်းလွဲခေါက်ရေ"))),
                        const SizedBox(width: 10),
                        Expanded(child: TextField(controller: _evening, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: "ညနေခင်းခေါက်ရေ"))),
                      ],
                    ),
                    const SizedBox(height: 15),
                    TextField(controller: _rate, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: "တစ်ခေါက်နှုန်း")),
                    const SizedBox(height: 15),
                    TextField(controller: _fuelPrice, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: "ဆီဖိုးကျသင့်ငွေ")),
                    const SizedBox(height: 20),
                    Text("စုစုပေါင်းခေါက်ရေ: $totalTrips ခေါက်", style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                    Text("စုစုပေါင်းရရှိငွေ: $totalSalary ကျပ်", style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.green)),
                    Text("တစ်ဂါလံနှုန်း: ${pricePerGallon.toStringAsFixed(2)} ကျပ်", style: const TextStyle(fontSize: 16, color: Colors.blue)),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Irrigation-Fleet-APK
          path: build/app/outputs/flutter-apk/app-release.apk
